limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
server {
  listen 80;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $api_upstream http://api:8080;
  # Avoid raw attacker-controlled request lines in connection error logs.
  error_log /dev/stderr crit;
  root /usr/share/nginx/html;
  client_max_body_size 24k;
  access_log off;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'";
  error_page 502 503 504 = @service_unavailable;
  location @service_unavailable { default_type application/json; return 503 '{"error":{"code":"upstream_unavailable"}}'; }
  location = /api/login { limit_req zone=login burst=30 nodelay; proxy_pass $api_upstream; }
  location /api/ { proxy_pass $api_upstream; proxy_read_timeout 90s; }
  location ^~ /internal/ { return 404; }
  # HTML must resolve the currently deployed asset names, even when an older
  # image had a later build timestamp. Hashed assets keep their normal caching.
  location = /index.html {
    if_modified_since off;
    etag off;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'";
  }
  location ~* ^/(api\.php|apirest\.php|front/|ajax/) { return 403; }
  location / { try_files $uri $uri/ /index.html; }
}
